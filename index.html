<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мои Смены</title>
    <!-- Google Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          extend: {
            colors: {
              primary: '#3b82f6'
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="style.css" />
    <!-- PWA Метатеги -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#6200ea" id="theme-color-meta" />
    <link rel="apple-touch-icon" href="icon-192.png" />
  </head>
  <body class="bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-100 to-slate-200 dark:from-slate-800 dark:to-slate-950 text-slate-900 dark:text-slate-100 flex justify-center items-start min-h-screen p-6 transition-colors duration-300 antialiased selection:bg-indigo-500/30">
    <div class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl p-6 rounded-[2rem] border border-white/50 dark:border-slate-700/50 shadow-xl w-full max-w-md transition-colors duration-300">
      <header class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-medium text-slate-900 dark:text-slate-100">Мои Смены</h1>
        <button id="theme-toggle" class="p-2 btn-squircle text-slate-500 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors" aria-label="Переключить тему">
          <span class="material-symbols-outlined" id="theme-icon">dark_mode</span>
        </button>
      </header>

      <div class="flex flex-col gap-3 mb-4">
        <button id="start-shift" class="py-3 px-6 btn-squircle font-medium transition-all duration-300 ease-in-out active:scale-95 hover:-translate-y-0.5 flex items-center justify-center gap-2 w-full bg-gradient-to-r from-blue-500 to-indigo-600 text-white shadow-lg shadow-indigo-500/30 hover:shadow-indigo-500/40 disabled:opacity-50 disabled:hover:translate-y-0">Начать смену</button>
        <button id="end-shift" class="py-3 px-6 btn-squircle font-medium transition-all duration-300 ease-in-out active:scale-95 hover:-translate-y-0.5 flex items-center justify-center gap-2 w-full bg-gradient-to-r from-red-500 to-rose-600 text-white shadow-lg shadow-rose-500/30 hover:shadow-rose-500/40 disabled:opacity-50 disabled:hover:translate-y-0" disabled>Завершить смену</button>
        <button id="add-manual-shift" class="py-3 px-6 btn-squircle font-medium transition-all duration-300 ease-in-out active:scale-95 hover:-translate-y-0.5 flex items-center justify-center gap-2 w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 shadow-sm hover:bg-slate-50 dark:hover:bg-slate-700/80 hover:shadow-md">
          Добавить смену вручную
        </button>
      </div>

      <button id="export-shifts-btn" class="py-3 px-6 btn-squircle font-medium transition-all duration-300 ease-in-out active:scale-95 hover:-translate-y-0.5 flex items-center justify-center gap-2 w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 shadow-sm hover:bg-slate-50 dark:hover:bg-slate-700/80 hover:shadow-md mb-6">
        Выгрузить смены (период)
      </button>

      <div id="status-message" class="text-sm font-medium text-slate-500 dark:text-slate-400 mt-2 text-center">Смена не начата</div>

      <div class="mt-6 text-left border-t border-slate-300 dark:border-slate-600 pt-6">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xl font-medium text-slate-900 dark:text-slate-100">История смен</h2>
          <div class="flex items-center gap-2">
            <label for="hourly-rate" class="text-sm text-slate-500 dark:text-slate-400">Ставка:</label>
            <input type="number" id="hourly-rate" placeholder="₽ / час" class="w-24 p-2 bg-slate-100 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl text-sm text-center focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow" />
          </div>
        </div>
        <div id="history-container"></div>
      </div>
    </div>

    <!-- Всплывающее окно редактирования -->
    <div id="edit-modal" class="modal opacity-0 pointer-events-none fixed inset-0 bg-black/50 backdrop-blur-sm flex justify-center items-center z-50 transition-all duration-300 ease-in-out">
      <div class="bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl border border-white/50 dark:border-slate-700/50 p-6 rounded-[2rem] w-[90%] max-w-sm shadow-2xl scale-95 transition-all duration-300 ease-out text-slate-900 dark:text-slate-100">
        <h3 class="mb-5 text-2xl">Редактировать смену</h3>
        <label class="text-sm text-slate-500 dark:text-slate-400 mb-1 block">Начало смены:</label>
        <input type="datetime-local" id="edit-start" class="w-full p-3 mb-5 bg-slate-100 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow" />
        <label class="text-sm text-slate-500 dark:text-slate-400 mb-1 block">Конец смены:</label>
        <input type="datetime-local" id="edit-end" class="w-full p-3 mb-5 bg-slate-100 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow" />
        <div class="flex gap-3 mt-2">
          <button id="save-edit" class="py-3 px-6 btn-squircle font-medium transition-all duration-300 ease-in-out active:scale-95 hover:-translate-y-0.5 flex items-center justify-center gap-2 w-full bg-gradient-to-r from-blue-500 to-indigo-600 text-white shadow-lg shadow-indigo-500/30 hover:shadow-indigo-500/40 disabled:opacity-50 disabled:hover:translate-y-0">Сохранить</button>
          <button id="cancel-edit" class="py-3 px-6 btn-squircle font-medium transition-all duration-300 ease-in-out active:scale-95 hover:-translate-y-0.5 flex items-center justify-center gap-2 w-full bg-gradient-to-r from-red-500 to-rose-600 text-white shadow-lg shadow-rose-500/30 hover:shadow-rose-500/40 disabled:opacity-50 disabled:hover:translate-y-0">Отмена</button>
        </div>
      </div>
    </div>

    <!-- Всплывающее окно выгрузки -->
    <div id="export-modal" class="modal opacity-0 pointer-events-none fixed inset-0 bg-black/50 backdrop-blur-sm flex justify-center items-center z-50 transition-all duration-300 ease-in-out">
      <div class="bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl border border-white/50 dark:border-slate-700/50 p-6 rounded-[2rem] w-[90%] max-w-sm shadow-2xl scale-95 transition-all duration-300 ease-out text-slate-900 dark:text-slate-100">
        <h3 class="mb-5 text-2xl">Выгрузить смены</h3>
        <label class="text-sm text-slate-500 dark:text-slate-400 mb-1 block">Начало периода:</label>
        <input type="date" id="export-start" class="w-full p-3 mb-5 bg-slate-100 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow" />
        <label class="text-sm text-slate-500 dark:text-slate-400 mb-1 block">Конец периода:</label>
        <input type="date" id="export-end" class="w-full p-3 mb-5 bg-slate-100 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow" />
        <div class="flex gap-3 mt-2">
          <button id="copy-export" class="py-3 px-6 btn-squircle font-medium transition-all duration-300 ease-in-out active:scale-95 hover:-translate-y-0.5 flex items-center justify-center gap-2 w-full bg-gradient-to-r from-blue-500 to-indigo-600 text-white shadow-lg shadow-indigo-500/30 hover:shadow-indigo-500/40 disabled:opacity-50 disabled:hover:translate-y-0">CSV</button>
          <button id="cancel-export" class="py-3 px-6 btn-squircle font-medium transition-all duration-300 ease-in-out active:scale-95 hover:-translate-y-0.5 flex items-center justify-center gap-2 w-full bg-gradient-to-r from-red-500 to-rose-600 text-white shadow-lg shadow-rose-500/30 hover:shadow-rose-500/40 disabled:opacity-50 disabled:hover:translate-y-0">Отмена</button>
        </div>
      </div>
    </div>

    <!-- Обновленное окно добавления вручную (с клавиатурой) -->
    <div id="add-modal" class="modal opacity-0 pointer-events-none fixed inset-0 bg-black/50 backdrop-blur-sm flex justify-center items-center z-50 transition-all duration-300 ease-in-out">
      <div class="bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl border border-white/50 dark:border-slate-700/50 p-6 rounded-[2rem] w-[90%] max-w-sm shadow-2xl scale-95 transition-all duration-300 ease-out text-slate-900 dark:text-slate-100">
        <h3 class="mb-5 text-2xl">Добавить смену</h3>
        <label class="text-sm text-slate-500 dark:text-slate-400 mb-1 block">Дата смены:</label>
        <input type="date" id="add-date" class="w-full p-3 mb-5 bg-slate-100 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow" />
        <label class="text-sm text-slate-500 dark:text-slate-400 mb-1 block">Время начала (ЧЧ:ММ):</label>
        <input
          type="text"
          inputmode="numeric"
          id="add-start-time"
          placeholder="Например: 09:00"
          class="w-full p-3 mb-5 bg-slate-100 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow"
        />
        <label class="text-sm text-slate-500 dark:text-slate-400 mb-1 block">Время конца (ЧЧ:ММ):</label>
        <input
          type="text"
          inputmode="numeric"
          id="add-end-time"
          placeholder="Например: 18:00"
          class="w-full p-3 mb-5 bg-slate-100 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow"
        />
        <div class="flex gap-3 mt-2">
          <button id="save-add" class="py-3 px-6 btn-squircle font-medium transition-all duration-300 ease-in-out active:scale-95 hover:-translate-y-0.5 flex items-center justify-center gap-2 w-full bg-gradient-to-r from-blue-500 to-indigo-600 text-white shadow-lg shadow-indigo-500/30 hover:shadow-indigo-500/40 disabled:opacity-50 disabled:hover:translate-y-0">Добавить</button>
          <button id="cancel-add" class="py-3 px-6 btn-squircle font-medium transition-all duration-300 ease-in-out active:scale-95 hover:-translate-y-0.5 flex items-center justify-center gap-2 w-full bg-gradient-to-r from-red-500 to-rose-600 text-white shadow-lg shadow-rose-500/30 hover:shadow-rose-500/40 disabled:opacity-50 disabled:hover:translate-y-0">Отмена</button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
    <script>
      // Регистрация Service Worker для офлайн-работы
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js")
            .then((reg) => console.log("Service Worker зарегистрирован"))
            .catch((err) =>
              console.log("Ошибка регистрации Service Worker", err),
            );
        });
      }
    </script>
  </body>
</html>
