<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Удобный учет рабочих смен и доходов — офлайн PWA-приложение" />
    <title>Учёт рабочих смен</title>

    <!-- PWA мета-теги и иконки -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#131535" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192x192.png?v=3" />
    <link rel="apple-touch-icon" href="icon-192x192.png?v=3" />

    <!-- Шрифты (preconnect + stylesheet вместо @import для скорости) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <nav class="month-selector header__month-selector" aria-label="Выбор месяца">
        <button
          id="prevMonthBtn"
          class="month-selector__btn"
          aria-label="Предыдущий месяц"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <h1 class="month-selector__title" id="monthTitle" title="Перейти к текущему месяцу" role="button" tabindex="0">Октябрь 2026</h1>
        <button
          id="nextMonthBtn"
          class="month-selector__btn"
          aria-label="Следующий месяц"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </nav>
      <div class="header__actions">
        <!-- Кнопка перехода к сегодняшнему дню -->
        <button
          id="todayBtn"
          class="btn btn--icon header__today-btn"
          title="Вернуться к текущему дню"
          aria-label="Вернуться к сегодняшнему дню"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
            <circle cx="12" cy="15" r="2" fill="currentColor"></circle>
          </svg>
        </button>

        <!-- Кнопка смены темы -->
        <button id="themeToggleBtn" class="btn btn--icon" aria-label="Сменить тему">
          <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>

        <!-- Кнопка настроек -->
        <button id="settingsBtn" class="btn btn--icon header__settings-btn" title="Настройки" aria-label="Настройки">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 1280 1280">
            <g transform="translate(0, 1280) scale(0.1, -0.1)" fill="currentColor">
              <path d="m6010,12794c-25,-2 -103,-9 -175,-15c-143,-12 -390,-49 -503,-74l-72,-17l0,-529l0,-530l-139,-207c-158,-234 -272,-376 -371,-461c-174,-150 -329,-225 -570,-277c-67,-15 -129,-18 -290,-18c-216,0 -338,13 -540,59l-103,23l-366,366l-367,367l-139,-112c-409,-327 -760,-689 -1070,-1102l-58,-78l355,-357l356,-357l40,-105c99,-258 137,-439 137,-655c0,-152 -9,-214 -47,-339c-97,-315 -393,-608 -871,-861l-104,-55l-510,0c-437,0 -512,-2 -516,-14c-10,-26 -55,-336 -69,-471c-8,-82 -13,-266 -12,-495c0,-373 10,-553 54,-954c11,-99 20,-183 20,-188c0,-4 227,-8 504,-8l503,0l84,-34c417,-169 661,-374 800,-672c141,-299 140,-732 -2,-1218l-21,-71l-356,-357l-356,-357l27,-40c45,-68 219,-281 350,-427c251,-282 517,-537 771,-740l130,-105l371,371l371,370l79,10c142,17 511,23 645,11c434,-40 741,-184 989,-464c75,-86 193,-261 250,-373l41,-81l0,-525l0,-525l103,-16c144,-23 406,-54 577,-69c189,-17 765,-16 935,0c137,14 468,59 498,68c16,5 17,39 17,538l0,532l46,95c141,290 366,525 634,659c117,59 291,114 445,141c113,20 164,23 385,24c154,0 302,-5 375,-14l120,-13l397,-400l398,-401l37,29c85,63 356,286 468,384c302,265 573,556 755,813l34,48l-397,397l-397,397l-34,170c-59,293 -70,384 -70,585c-1,143 4,204 18,270c48,220 136,387 291,549c142,149 293,255 533,375l132,66l575,0l575,0l5,23c7,35 34,248 50,407c52,515 43,1075 -26,1529c-11,75 -22,144 -25,154c-5,16 -42,17 -589,17l-584,0l-128,64c-540,271 -784,609 -818,1136c-10,155 22,485 75,760l10,55l405,405l405,405l-64,93c-205,303 -507,614 -872,897c-182,143 -372,278 -382,273c-5,-1 -184,-174 -396,-383c-279,-274 -397,-384 -424,-393c-20,-8 -100,-27 -177,-43c-747,-155 -1306,99 -1725,786l-60,99l0,553c0,455 -2,553 -13,553c-8,0 -94,9 -193,20c-364,40 -536,51 -829,54c-165,2 -320,2 -345,0zm725,-4200c242,-29 482,-102 720,-219c252,-124 440,-260 636,-461c291,-300 495,-679 589,-1095c65,-289 67,-678 4,-964c-181,-817 -764,-1463 -1548,-1714c-241,-77 -425,-105 -691,-105c-372,0 -669,68 -1000,229c-332,161 -616,393 -826,675c-113,152 -159,227 -239,392c-117,239 -193,507 -221,777c-16,153 -6,431 20,586c123,727 562,1329 1214,1665c420,217 856,293 1342,234z"></path>
            </g>
          </svg>
        </button>
      </div>
    </header>

    <main class="main">
      <!-- Статистика за месяц -->
      <section class="stats main__stats" aria-label="Статистика за месяц">
        <article class="stats__card">
          <div class="stats__value" id="statShifts">0</div>
          <div class="stats__label">Смен</div>
        </article>
        <article class="stats__card">
          <div class="stats__value" id="statHours">0</div>
          <div class="stats__label">Часов</div>
        </article>
        <article class="stats__card stats__card--income">
          <div class="stats__value" id="statIncome">0 ₽</div>
          <div class="stats__label">Доход</div>
        </article>
      </section>

      <!-- Календарь -->
      <section class="calendar main__calendar" aria-label="Календарь">
        <div class="calendar__weekdays">
          <span class="calendar__weekday">Пн</span>
          <span class="calendar__weekday">Вт</span>
          <span class="calendar__weekday">Ср</span>
          <span class="calendar__weekday">Чт</span>
          <span class="calendar__weekday">Пт</span>
          <span class="calendar__weekday">Сб</span>
          <span class="calendar__weekday">Вс</span>
        </div>
        <div class="calendar__grid" id="calendarGrid"></div>
      </section>

      <!-- Кнопка вызова детализации смен -->
      <section class="shifts-trigger main__shifts-trigger" aria-label="Детализация смен">
        <button id="openShiftsBtn" class="shifts-trigger__btn" type="button" aria-haspopup="dialog" aria-expanded="false">
          <div class="shifts-trigger__left">
            <svg class="shifts-trigger__icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
              <path d="M9 12h6"></path>
              <path d="M9 16h6"></path>
            </svg>
            <span class="shifts-trigger__title">Детализация за месяц</span>
          </div>
          <div class="shifts-trigger__right">
            <span class="shifts-trigger__badge" id="statShiftsBadge"></span>
            <svg class="shifts-trigger__chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </div>
        </button>
      </section>
    </main>

    <!-- Модальное окно детализации смен (Отдельное меню) -->
    <div class="modal-overlay" id="shiftsModal">
      <div class="modal modal--shifts modal-overlay__content" role="dialog" aria-modal="true" aria-labelledby="shiftsModalTitle">
        <header class="modal__header">
          <div>
            <h3 class="modal__title" id="shiftsModalTitle">Детализация смен</h3>
            <div class="modal__subtitle" id="shiftsModalMonth">Октябрь 2026</div>
          </div>
          <button
            class="btn btn--icon modal__close-btn"
            id="shiftsModalCloseBtn"
            aria-label="Закрыть"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </header>

        <div class="shifts__export-group modal__export-group">
          <button class="btn btn--secondary shifts__export-btn" id="exportMonthBtn">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            За месяц
          </button>
          <button class="btn btn--secondary shifts__export-btn shifts__export-btn--subtle" id="exportAllBtn">
            За всё время
          </button>
        </div>

        <div class="shift-list" id="shiftList"></div>
      </div>
    </div>

    <!-- Модальное окно смены -->
    <div class="modal-overlay" id="shiftModal">
      <div class="modal modal-overlay__content" role="dialog" aria-modal="true" aria-labelledby="shiftModalTitle">
        <header class="modal__header">
          <h3 class="modal__title" id="shiftModalTitle">Смена</h3>
          <button
            class="btn btn--icon modal__close-btn"
            id="shiftModalCloseBtn"
            aria-label="Закрыть"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </header>
        <form class="form modal__form" id="shiftForm">
          <input type="hidden" id="shiftDate" />

          <div class="form__group">
            <label class="form__label">Тип смены</label>
            <div class="segmented-control" role="radiogroup" aria-label="Тип смены" id="shiftTypeSegmented">
              <button type="button" class="segmented-control__btn is-active" data-value="day">
                <svg class="segmented-control__icon segmented-control__icon--sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="4"></circle>
                  <path d="M12 2v2"></path>
                  <path d="M12 20v2"></path>
                  <path d="m4.93 4.93 1.41 1.41"></path>
                  <path d="m17.66 17.66 1.41 1.41"></path>
                  <path d="M2 12h2"></path>
                  <path d="M20 12h2"></path>
                  <path d="m6.34 17.66-1.41 1.41"></path>
                  <path d="m19.07 4.93-1.41 1.41"></path>
                </svg>
                День
              </button>
              <button type="button" class="segmented-control__btn" data-value="night">
                <svg class="segmented-control__icon segmented-control__icon--moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
                </svg>
                Ночь
              </button>
              <button type="button" class="segmented-control__btn" data-value="extra">
                <svg class="segmented-control__icon segmented-control__icon--flame" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path>
                </svg>
                Подработка
              </button>
            </div>
            <input type="hidden" id="shiftType" value="day" />
          </div>

          <div class="form__row">
            <div class="form__group">
              <label class="form__label" for="startTime">Начало</label>
              <input
                class="form__control form__input"
                type="time"
                id="startTime"
                required
              />
            </div>
            <div class="form__group">
              <label class="form__label" for="endTime">Конец</label>
              <input
                class="form__control form__input"
                type="time"
                id="endTime"
                required
              />
            </div>
          </div>

          <div class="form__row">
            <div class="form__group">
              <label class="form__label" for="breakMins">Перерыв (минут)</label>
              <input
                class="form__control form__input"
                type="number"
                id="breakMins"
                value="0"
                min="0"
                step="5"
              />
            </div>
            <div class="form__group">
              <label class="form__label" for="totalHours">Часов к оплате</label>
              <input
                class="form__control form__input"
                type="number"
                id="totalHours"
                step="0.25"
                required
              />
            </div>
          </div>

          <div class="form__group">
            <label class="form__label" id="rateLabel" for="rate">Ставка</label>
            <div class="input-with-segmented">
              <input
                class="form__control form__input input-with-segmented__input"
                type="number"
                id="rate"
                step="any"
                placeholder="0"
                required
              />
              <div class="segmented-control segmented-control--suffix" role="radiogroup" aria-label="Вид оплаты" id="payModeSegmented">
                <button type="button" class="segmented-control__btn is-active" data-value="hourly" id="payModeHourlyBtn">
                  ₽/час
                </button>
                <button type="button" class="segmented-control__btn" data-value="fixed" id="payModeFixedBtn">
                  ₽/смена
                </button>
              </div>
              <input type="hidden" id="payMode" value="hourly" />
            </div>
          </div>

          <div class="form__row">
            <div class="form__group">
              <label class="form__label" for="bonus">Бонус / Чаевые (₽)</label>
              <input
                class="form__control form__input"
                type="number"
                id="bonus"
                value="0"
                step="any"
              />
            </div>
            <div class="form__group">
              <label class="form__label" for="totalPay"
                >Итого за смену (₽)</label
              >
              <input
                class="form__control form__input form__input--highlight"
                type="number"
                id="totalPay"
                step="any"
                required
              />
            </div>
          </div>

          <div class="form__group">
            <label class="form__label" for="note"
              >Заметка (точка, комментарий)</label
            >
            <input
              class="form__control form__input"
              type="text"
              id="note"
              placeholder="Например: замена, центр..."
            />
          </div>

          <div class="form__actions">
            <button
              type="button"
              class="btn btn--danger form__btn"
              id="deleteBtn"
              style="display: none"
            >
              Удалить
            </button>
            <button type="submit" class="btn btn--primary form__btn">
              Сохранить
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Модальное окно настроек -->
    <div class="modal-overlay" id="settingsModal">
      <div class="modal modal-overlay__content" role="dialog" aria-modal="true" aria-labelledby="settingsModalTitle">
        <header class="modal__header">
          <h3 class="modal__title" id="settingsModalTitle">Настройки по умолчанию</h3>
          <button
            class="btn btn--icon modal__close-btn"
            id="settingsModalCloseBtn"
            aria-label="Закрыть"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </header>
        <form class="form modal__form" id="settingsForm">
          <div class="form__row">
            <div class="form__group">
              <label class="form__label" for="defStart"
                >Стандартное начало</label
              >
              <input
                class="form__control form__input"
                type="time"
                id="defStart"
              />
            </div>
            <div class="form__group">
              <label class="form__label" for="defEnd">Стандартный конец</label>
              <input
                class="form__control form__input"
                type="time"
                id="defEnd"
              />
            </div>
          </div>
          <div class="form__row">
            <div class="form__group">
              <label class="form__label" for="defBreak">Перерыв (минут)</label>
              <input
                class="form__control form__input"
                type="number"
                id="defBreak"
                min="0"
                step="5"
              />
            </div>
            <div class="form__group">
              <label class="form__label" for="defCurrency">Валюта</label>
              <input
                class="form__control form__input"
                type="text"
                id="defCurrency"
                value="₽"
              />
            </div>
          </div>
          <div class="form__group">
            <label class="form__label" for="defRate">Базовая ставка</label>
            <div class="input-with-segmented">
              <input
                class="form__control form__input input-with-segmented__input"
                type="number"
                id="defRate"
                step="any"
                placeholder="0"
              />
              <div class="segmented-control segmented-control--suffix" role="radiogroup" aria-label="Вид оплаты по умолчанию" id="defPayModeSegmented">
                <button type="button" class="segmented-control__btn is-active" data-value="hourly" id="defPayModeHourlyBtn">
                  ₽/час
                </button>
                <button type="button" class="segmented-control__btn" data-value="fixed" id="defPayModeFixedBtn">
                  ₽/смена
                </button>
              </div>
              <input type="hidden" id="defPayMode" value="hourly" />
            </div>
          </div>
          <button
            type="submit"
            class="btn btn--primary form__btn form__btn--full"
          >
            Сохранить шаблон
          </button>
        </form>

        <hr class="modal__divider" />
        <h4 class="modal__subtitle">Резервная копия данных</h4>
        <div class="modal__actions">
          <button id="backupDownloadBtn" class="btn btn--secondary modal__action-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
              <polyline points="17 21 17 13 7 13 7 21"></polyline>
              <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
            Скачать бэкап
          </button>
          <button id="backupRestoreBtn" class="btn btn--secondary modal__action-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            Загрузить
          </button>
          <input
            type="file"
            id="importFile"
            style="display: none"
            accept=".json"
          />
        </div>
      </div>
    </div>

    <!-- Кастомное диалоговое окно подтверждения -->
    <div class="modal-overlay modal-overlay--dialog" id="confirmModal">
      <div class="modal modal--dialog modal-overlay__content" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
        <div class="modal__dialog-icon" id="confirmIcon"></div>
        <h3 class="modal__dialog-title" id="confirmTitle">Подтверждение</h3>
        <p class="modal__dialog-message" id="confirmMessage">Вы уверены?</p>
        <div class="modal__dialog-actions">
          <button type="button" class="btn btn--secondary modal__dialog-btn" id="confirmCancelBtn">
            Отмена
          </button>
          <button type="button" class="btn btn--danger modal__dialog-btn" id="confirmOkBtn">
            Удалить
          </button>
        </div>
      </div>
    </div>

    <!-- Всплывающий тост для уведомлений -->
    <div id="appToast" class="app-toast" role="status" aria-live="polite">
      <span class="app-toast__icon" aria-hidden="true"></span>
      <span class="app-toast__message"></span>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
